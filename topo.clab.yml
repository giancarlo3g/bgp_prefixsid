name: bgpprefixsid
prefix: ""

topology:
  defaults:
    kind: nokia_sros
  kinds:
    nokia_srsim:
      image: nokia_srsim:25.7.R1
      license: ../license-srsim25.txt
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:25.10.1
      # license is required to run IXR-DNX and 7730 on Containerlab
      license: ../license-srl25.10.txt
    linux:
      image: ghcr.io/mfzhsn/network-multitool-sshd:0.0.2
  nodes:
  # Ring-1: RSVP access ring
    R01-IXR: #IXR-R6
      kind: nokia_srsim
      type: ixr-r6
      env:
        NOKIA_SROS_MDA_1: m4-10g-sfp++1-100g-cfp2
        NOKIA_SROS_MDA_2: m6-10g-sfp++1-100g-qsfp28
      startup-config: ./startup_config/R01-IXR.partial.txt
      ports:
        - 50101:22
        - 50102:57400
        - 50103:830  
    R02-IXR: #IXR-e2
      kind: nokia_srsim
      type: ixr-e2   
      startup-config: ./startup_config/R02-IXR.partial.txt
      ports:
        - 50201:22
        - 50202:57400
        - 50203:830
    R03-IXR: #IXR-R6
      kind: nokia_srsim
      type: ixr-r6
      env:
        NOKIA_SROS_MDA_1: m4-10g-sfp++1-100g-cfp2
        NOKIA_SROS_MDA_2: m6-10g-sfp++1-100g-qsfp28
      startup-config: ./startup_config/R03-IXR.partial.txt
      ports:
        - 50301:22
        - 50302:57400
        - 50303:830
    R04-IXR: #IXR-R6
      kind: nokia_srsim
      type: ixr-r6
      env:
        NOKIA_SROS_MDA_1: m4-10g-sfp++1-100g-cfp2
        NOKIA_SROS_MDA_2: m6-10g-sfp++1-100g-qsfp28
      startup-config: ./startup_config/R04-IXR.partial.txt
      ports:
        - 50401:22
        - 50402:57400
        - 50403:830
    # Core SR-MPLS
    R05-SR: #SR-1
      kind: nokia_srsim
      type: sr-1
      startup-config: ./startup_config/R05-SR.partial.txt
      ports:
        - 50501:22
        - 50502:57400
        - 50503:830
    R06-SR: #SR-1 (ASBR)
      kind: nokia_srsim
      type: sr-1
      startup-config: ./startup_config/R06-SR.partial.txt
      ports:
        - 50601:22
        - 50602:57400
        - 50603:830
    R07-SR: #SR-1
      kind: nokia_srsim
      type: sr-1
      startup-config: ./startup_config/R07-SR.partial.txt
      ports:
        - 50701:22
        - 50702:57400
        - 50703:830
    R08-SR: #SR-1
      kind: nokia_srsim
      type: sr-1
      startup-config: ./startup_config/R08-SR.partial.txt
      ports:
        - 50801:22
        - 50802:57400
        - 50803:830
    R09-SR: #SR-1
      kind: nokia_srsim
      type: sr-1
      startup-config: ./startup_config/R09-SR.partial.txt
      ports:
        - 50901:22
        - 50902:57400
        - 50903:830
    R10-SR: #SR-1
      kind: nokia_srsim
      type: sr-1
      startup-config: ./startup_config/R10-SR.partial.txt
      ports:
        - 51001:22
        - 51002:57400
        - 51003:830
    R11-SR: #SR-1 (ASBR)
      kind: nokia_srsim
      type: sr-1
      startup-config: ./startup_config/R11-SR.partial.txt
      ports:
        - 51101:22
        - 51102:57400
        - 51103:830
    # R12-SR: #SR-1
    #   kind: nokia_srsim
    #   type: sr-1
    #   startup-config: ./startup_config/R12-SR.partial.txt
    #   ports:
    #     - 51201:22
    #     - 51202:57400
    #     - 51203:830
    R12-SXR: #SXR
      kind: nokia_srlinux
      type: sxr-1d-32d
      startup-config: ./startup_config/R12-SXR.partial.txt
      ports:
        - 51201:22
        - 51202:57400
        - 51203:830
    # Ring-2: access SR-MPLS
    R13-IXR: #IXR-R6d
      kind: nokia_srsim
      type: ixr-r6d
      components:
        - slot: A
        - slot: 1
          env:
            NOKIA_SROS_CARD: iom-ixr-r6d
            NOKIA_SROS_MDA_1: m5-100g-qsfp28
      startup-config: ./startup_config/R13-IXR.partial.txt
      ports: 
        - 51301:22
        - 51302:57400
        - 51303:830
    R14-IXR: #IXR-e2
      kind: nokia_srsim
      type: ixr-e2
      startup-config: ./startup_config/R14-IXR.partial.txt
      ports:
        - 51401:22
        - 51402:57400
        - 51403:830
    R15-IXR: #IXR-R6d
      kind: nokia_srsim
      type: ixr-r6d
      components:
        - slot: A
        - slot: 1
          env:
            NOKIA_SROS_CARD: iom-ixr-r6d
            NOKIA_SROS_MDA_1: m5-100g-qsfp28
      startup-config: ./startup_config/R15-IXR.partial.txt
      ports:
        - 51501:22
        - 51502:57400
        - 51503:830
    R16-IXR: #IXR-e2
      kind: nokia_srsim
      type: ixr-e2
      startup-config: ./startup_config/R16-IXR.partial.txt
      ports:
        - 51601:22
        - 51602:57400
        - 51603:830  
    tester1:
      kind: linux
      exec:
        - ip link add link eth1 name eth1.10 type vlan id 10
        - ifconfig eth1.10 192.168.0.1
        - ifconfig eth1.10 netmask 255.255.255.0 
        - ip link add link eth1 name eth1.116 type vlan id 116
        - ifconfig eth1.116 192.168.116.1
        - ifconfig eth1.116 netmask 255.255.255.0 
    tester2:
      kind: linux
      exec:
        - ip link add link eth1 name eth1.10 type vlan id 10
        - ifconfig eth1.10 192.168.0.2
        - ifconfig eth1.10 netmask 255.255.255.0 
        - ip link add link eth1 name eth1.20 type vlan id 20
        - ifconfig eth1.20 192.168.200.2
        - ifconfig eth1.20 netmask 255.255.255.0
        - route add default gw 192.168.200.1 eth1.20 
    tester3:
      kind: linux
      exec:
        - ip link add link eth1 name eth1.10 type vlan id 10
        - ifconfig eth1.10 192.168.0.3
        - ifconfig eth1.10 netmask 255.255.255.0 
    tester4:
      kind: linux
      exec:
        - ifconfig eth1 192.168.0.4
        - ifconfig eth1 netmask 255.255.255.0
    tester5:
      kind: linux
      exec:
        - ip link add link eth1 name eth1.10 type vlan id 10
        - ifconfig eth1.10 192.168.0.5
        - ifconfig eth1.10 netmask 255.255.255.0
        - ip link add link eth1 name eth1.20 type vlan id 20
        - ifconfig eth1.20 192.168.20.5
        - ifconfig eth1.20 netmask 255.255.255.0
        - route add default gw 192.168.20.1 eth1.20
    tester11:
      kind: linux
      exec:
        - ifconfig eth1 192.168.0.11
        - ifconfig eth1 netmask 255.255.255.0
    tester13:
      kind: linux
      exec:
        - ifconfig eth1 192.168.0.13
        - ifconfig eth1 netmask 255.255.255.0
    tester14:
      kind: linux
      exec:
        - ip link add link eth1 name eth1.10 type vlan id 10
        - ifconfig eth1.10 192.168.0.14
        - ifconfig eth1.10 netmask 255.255.255.0
    tester16:
      kind: linux
      exec:
        - ip link add link eth1 name eth1.10 type vlan id 10
        - ifconfig eth1.10 192.168.0.16
        - ifconfig eth1.10 netmask 255.255.255.0  
        - ip link add link eth1 name eth1.116 type vlan id 116
        - ifconfig eth1.116 192.168.116.16
        - ifconfig eth1.116 netmask 255.255.255.0 

#################################################################################################################################################
#Telemetry 
#################################################################################################################################################
    gnmic:
      kind: linux
      image: ghcr.io/openconfig/gnmic
      binds:
        - ./tele-config/gnmic.yaml:/app/gnmic.yaml:ro
        - /var/run/docker.sock:/var/run/docker.sock
      cmd: "--config /app/gnmic.yaml --log subscribe"

    consul-agent:
      kind: linux
      image: consul:1.15.4
      ports:
        - 8500:8500
        - 8600:8600/udp
      cmd: "agent -server -ui -bind=127.0.0.1 -node=server-1 -bootstrap-expect=1 -client=0.0.0.0"

    prometheus:
      kind: linux
      image: prom/prometheus:latest
      user: 65534:65534
      ports:
        - 9090:9090
      binds:
        - ./tele-config/prometheus:/etc/prometheus/
      cmd: |
        --config.file=/etc/prometheus/prometheus.yaml
        --web.console.libraries=/usr/share/prometheus/console_libraries
        --web.console.templates=/usr/share/prometheus/consoles
        --log.level=debug

    grafana:
      kind: linux
      image: grafana/grafana:latest
      binds:
        - ./tele-config/grafana/datasources/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
        - ./tele-config/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
        - ./tele-config/grafana/dashboards:/var/lib/grafana/dashboards
      ports:
        - 3000:3000 

#################################################################################################################################################
#Links 
#################################################################################################################################################

  links:
  #Connections
    - endpoints: ["R01-IXR:1/1/5", "R02-IXR:1/1/c3/1"]
    - endpoints: ["R01-IXR:1/2/c7/1", "R03-IXR:1/2/c7/1"]
    - endpoints: ["R01-IXR:1/1/1", "tester1:eth1"]
    - endpoints: ["R03-IXR:1/1/1", "tester3:eth1"]
    - endpoints: ["R03-IXR:1/1/5", "R05-SR:1/1/c1/1"]
    - endpoints: ["R05-SR:1/1/c2/1", "R06-SR:1/1/c2/1"]
    - endpoints: ["R05-SR:1/1/c3/1", "R07-SR:1/1/c1/1"]
    - endpoints: ["R07-SR:1/1/c2/1", "R08-SR:1/1/c2/1"]
    - endpoints: ["R07-SR:1/1/c3/1", "R09-SR:1/1/c1/1"]
    - endpoints: ["R09-SR:1/1/c2/1", "R10-SR:1/1/c2/1"]
    - endpoints: ["R09-SR:1/1/c3/1", "R11-SR:1/1/c1/1"]
    - endpoints: ["R11-SR:1/1/c2/1", "R12-SXR:e1-2"]
    - endpoints: ["R11-SR:1/1/c3/1", "R13-IXR:1/1/c1/1"]
    - endpoints: ["R13-IXR:1/1/c2/1", "tester13:eth1"]
    - endpoints: ["R13-IXR:1/1/c3/1", "R15-IXR:1/1/c1/1"]
    - endpoints: ["R15-IXR:1/1/c2/1", "R16-IXR:1/1/c1/1"]
    - endpoints: ["R16-IXR:1/1/c2/1", "tester16:eth1"]
    - endpoints: ["R15-IXR:1/1/c3/1", "R14-IXR:1/1/c1/1"]
    - endpoints: ["R14-IXR:1/1/c2/1", "tester14:eth1"]
    - endpoints: ["R14-IXR:1/1/c3/1", "R12-SXR:e1-1"]
    - endpoints: ["R12-SXR:e1-3", "R10-SR:1/1/c1/1"]
    - endpoints: ["R10-SR:1/1/c3/1", "R08-SR:1/1/c1/1"]
    - endpoints: ["R08-SR:1/1/c3/1", "R06-SR:1/1/c1/1"]
    - endpoints: ["R06-SR:1/1/c3/1", "R04-IXR:1/1/5"]
    - endpoints: ["R02-IXR:1/1/c1/1", "R04-IXR:1/2/c7/1"]
    - endpoints: ["R04-IXR:1/1/1", "tester4:eth1"]
    - endpoints: ["R02-IXR:1/1/c2/1", "tester2:eth1"]
    - endpoints: ["R05-SR:1/1/c4/1", "tester5:eth1"]
    - endpoints: ["R11-SR:1/1/c4/1", "tester11:eth1"]
